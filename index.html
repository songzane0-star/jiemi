  <div class="top-right"><span class="currency"><i data-icon="coin"></i><b id="coins">350</b><small>贝币</small></span><button class="round-button" id="soundBtn" data-action="sound" aria-label="开启声音" data-icon="sound"></button><button class="round-button" data-action="settings" aria-label="设置" data-icon="settings"></button></div>
</header>

<div class="world-label" id="areaLabel">迎风广场</div>
<button class="producer-chip round-button" data-action="producer" aria-label="查看游戏制作人" title="游戏制作人" data-icon="producer"></button>
<div class="camera-tools"><button class="round-button" data-action="zoomIn" aria-label="放大" data-icon="plus"></button><button class="round-button" data-action="zoomOut" aria-label="缩小" data-icon="minus"></button><button class="round-button" data-action="map" aria-label="小岛地图" data-icon="map"></button></div>

<button data-action="craft"><span data-icon="hammer"></span><b>制作</b><kbd>C</kbd></button>
<button data-action="decorate"><span data-icon="chair"></span><b>布置</b><kbd>F</kbd></button>

function openMap(){showSheet('map',header('晴屿散步地图','点一个目的地，慢慢走过去。','map')+`<div class="map-wrap"><canvas id="miniMap" width="660" height="510" aria-label="全岛地图，点击地面自动前往"></canvas></div><div class="map-legend"><span><i style="background:#e5a88f"></i>我的位置</span><span><i style="background:#9cab84"></i>小屋与杂货铺</span><span><i style="background:#75b8b2"></i>池塘与海边钓场</span></div><p class="note">散步手帐：${S.book.filter(x=>String(x).startsWith('stamp')).length} / 3 枚。北岸摘桃、东侧种花、南岸露营。到各地木牌旁盖章。</p>`);const c=$('#miniMap'),g=c.getContext('2d'),s=Math.min(660/WORLD_W,510/WORLD_H),ox=(660-WORLD_W*s)/2,oy=(510-WORLD_H*s)/2;g.fillStyle='#8fc9c1';g.fillRect(0,0,660,510);g.save();g.translate(ox,oy);g.scale(s,s);g.drawImage(groundCache,0,0);for(const o of objects){if(o.kind==='aquarium')drawObject(g,o,0);if(['home','shop','neighborhouse'].includes(o.kind))drawHouse(g,o);if(['fruit','pine','tree'].includes(o.kind))drawTree(g,o,0);}g.restore();const names=[['我的小屋',655,640],['花圃',800,930],['杂货铺',1280,500],['池塘',1500,690],['水族馆',1530,994],['海钓栈桥',1020,1410],['北岸果林',2310,360],['东侧湿地',2460,1000],['南岸露营地',1770,1900]];names.forEach(([n,x,y])=>label(g,n,x*s+ox,y*s+oy,'#fff6dbe6','#778563',9));ellipse(g,P.x*s+ox,P.y*s+oy,6,6,'#e59d84');ellipse(g,P.x*s+ox,P.y*s+oy,2,2,'#fff7d8');c.addEventListener('pointerup',e=>{if(S.room){toast('先离开小屋，再去岛上散步吧。');return;}const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)/r.width*660,my=(e.clientY-r.top)/r.height*510,x=(mx-ox)/s,y=(my-oy)/s;if(routeTo(x,y)){P.target=null;closeSheet();toast('出发，慢慢走过去。');}else toast('那里还不能到达，选岛上的空地试试。');});}

function validSave(s){if(!s||s.version!==1||typeof s.name!=='string'||s.name.length>8||!Number.isInteger(s.day)||s.day<1||s.day>100000||!Number.isFinite(s.coins)||s.coins<0||s.coins>1e9||!s.bag||typeof s.bag!=='object')return false;for(const[k,v]of Object.entries(s.bag))if(!ITEMS[k]||!Number.isInteger(v)||v<0||v>1e6)return false;if(!/^#[a-fA-F0-9]{6}$/.test(s.shirt)||!/^#[a-fA-F0-9]{6}$/.test(s.roof))return false;for(const key of['met','talked','gifted','requests','claimed','book','gathered','decor'])if(!Array.isArray(s[key])||s[key].length>1000)return false;for(const o of s.decor)if(!ITEMS[o.kind]?.decor||!Number.isFinite(o.x)||!Number.isFinite(o.y)||o.x<0||o.x>WORLD_W||o.y<0||o.y>WORLD_H)return false;for(const v of Object.values(s.friendship||{}))if(!Number.isFinite(v)||v<0||v>100)return false;for(const v of Object.values(s.stats||{}))if(!Number.isFinite(v)||v<0||v>1e9)return false;return s.plants&&typeof s.plants==='object'&&Object.keys(s.plants).length<=12&&Object.values(s.plants).every(p=>p&&Number.isFinite(p.at)&&/^#[a-fA-F0-9]{6}$/.test(p.color));}

function acceptImport(){if(!pendingImport)return;S={...newState(),...pendingImport};pendingImport=null;P.x=S.room?1100:Math.max(320,Math.min(1800,S.px||970));P.y=S.room?980:Math.max(280,Math.min(1350,S.py||1020));P.path=[];P.target=null;cam.x=P.x;cam.y=P.y-85;initWorld();save();updateHUD();closeSheet();toast('欢迎回来，你的小岛已恢复。');}
function startGame(){soundOn=!!S.music;$('#soundBtn').innerHTML=icon(soundOn?'sound':'mute');const input=$('#playerName');S.name=input.value.trim().slice(0,8)||'小晴';S.started=true;save();$('#welcome').classList.add('out');setTimeout(()=>{$('#welcome').hidden=true;},480);chime();if(!S.met.includes(301)){toast('欢迎登岛，'+S.name+'！点击附近的小麦，和新邻居打个招呼吧。');}else toast('欢迎回来，'+S.name+'。今天也慢慢来。');}
function dispatch(action,id){if(busy&&action!=='sound')return;switch(action){case'start':startGame();break;case'close':closeSheet();break;case'bag':openBag();break;case'bagTab':openBag(id);break;case'selectItem':$$('.item-card').forEach(x=>x.classList.toggle('selected',x.dataset.id===id));$('#itemDetail').innerHTML=bagDetail(id);break;case'craft':openCraft();break;case'craftItem':craftItem(id);break;case'decorate':openDecorate();break;case'place':startPlacement(id);break;case'placeConfirm':confirmPlacement();break;case'placeCancel':cancelPlacement();break;case'rotate':if(placing)placing.rotation=(placing.rotation+1)%2;break;case'reclaim':{const i=S.decor.findIndex(o=>String(o.id)===String(id));if(i>=0){add(S.decor[i].kind);S.decor.splice(i,1);save();navCache=null;closeSheet();toast('家具已回到背包，随时可以换个地方。');}break;}case'friends':openFriends();break;case'findFriend':{if(S.room)return toast('先出门，再去找邻居吧。');closeSheet();const n=objects.find(o=>o.id===Number(id));setTimeout(()=>approach(n),250);break;}case'gift':gift(id);break;case'giveGift':giveGift(id);break;case'request':fulfillRequest(id);break;case'wishes':openWishes();break;case'claim':claim(id);break;case'tank':openTank();break;case'donateFish':donateFish(id);break;case'book':openBook();break;case'bookTab':openBook(id);break;case'bookDetail':$('#bookDetail').innerHTML=`<div class="item-detail"><p><b>${ITEMS[id].name}</b><br>${ITEMS[id].desc}</p></div>`;break;case'shopTab':openShop(id);break;case'buy':buy(id);break;case'sell':sell(id);break;case'fishCast':cast();break;case'fishReel':reel();break;case'fishAgain':openFishing(id);break;case'roof':S.roof=id;save();openHome();break;case'enterHome':enterHome();break;case'upgradeHome':if(S.coins>=800&&S.homeLevel===1){S.coins-=800;S.homeLevel=2;save();updateHUD();openHome();chime();toast('小屋门前，多了一份花香。');}break;case'rest':openRest();break;case'sleep':sleep();break;case'findGarden':if(S.room)return toast('先离开小屋，再去花圃吧。');closeSheet();setTimeout(()=>approach(objects.find(o=>o.id===200)),250);break;case'interact':if(nearest)interactObject(nearest);else toast('走近树木、海边、花圃或邻居，再互动吧。');break;case'zoomIn':cam.goalZoom=Math.min(1.6,cam.goalZoom+.15);break;case'zoomOut':cam.goalZoom=Math.max(.45,cam.goalZoom-.15);break;case'map':openMap();break;case'island':openIsland();break;case'producer':openProducer();break;case'settings':openSettings();break;case'sound':soundOn=!soundOn;S.music=soundOn;save();$('#soundBtn').innerHTML=icon(soundOn?'sound':'mute');$('#soundBtn').setAttribute('aria-label',soundOn?'关闭声音':'开启声音');tone(660,.15);if(modal==='settings')openSettings();break;case'shirt':S.shirt=id;save();tone(660,.1);break;case'export':exportSave();break;case'import':importSave();break;case'importConfirm':acceptImport();break;case'resetAsk':showSheet('reset',header('和现在的小岛告别？','这会清除本机进度。可先导出存档留念。','leaf')+'<div class="button-row"><button class="secondary" data-action="close">继续现在的生活</button><button class="primary" data-action="resetYes">确认，重新登岛</button></div>');break;case'resetYes':S=newState();P.x=970;P.y=1020;P.path=[];P.target=null;cam.x=P.x;cam.y=P.y-85;navCache=null;initWorld();save();updateHUD();closeSheet();$('#welcome').classList.remove('out');$('#welcome').hidden=false;$('#playerName').value=S.name;break;}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const color=b.dataset.color;if(color){S.shirt=color;$$('#colorPicker button').forEach(x=>x.classList.toggle('selected',x===b));return;}if(b.dataset.action){tone(480,.04,'sine',.025);dispatch(b.dataset.action,b.dataset.id);}const r=b.getBoundingClientRect(),n=document.createElement('i');n.className='tap-bloom';n.style.left=(e.clientX||r.x+r.width/2)+'px';n.style.top=(e.clientY||r.y+r.height/2)+'px';$('#game').append(n);setTimeout(()=>n.remove(),600);});
$('.modal-backdrop').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if((!S.started||!$('#welcome').hidden)&&modal!=='producer')return;if(k==='escape'){if(placing)cancelPlacement();else closeSheet();return;}if(modal){if(k===' '&&fishSession?.state==='bite')reel();if(k==='tab'){const els=$$('#sheet button:not(:disabled),#sheet input'),first=els[0],last=els.at(-1);if(!els.length){e.preventDefault();return;}if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#sheet'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(e.repeat&&['e','b','c','f'].includes(k))return;if(k==='e'){if(nearest)interactObject(nearest);}else if(k==='b')openBag();else if(k==='c')openCraft();else if(k==='f')openDecorate();else if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keys.add(k);P.path=[];P.target=null;}});
document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();joy.x=joy.y=0;});document.addEventListener('visibilitychange',()=>{keys.clear();joy.x=joy.y=0;if(document.hidden)save();lastFrame=performance.now();});
let joyPointer=null;$('#joystick').addEventListener('pointerdown',e=>{if(modal||!$('#welcome').hidden)return;joyPointer=e.pointerId;$('#joystick').setPointerCapture(e.pointerId);moveJoy(e);});$('#joystick').addEventListener('pointermove',e=>{if(joyPointer===e.pointerId)moveJoy(e);});function moveJoy(e){const r=$('#joystick').getBoundingClientRect(),x=e.clientX-r.x-r.width/2,y=e.clientY-r.y-r.height/2,d=Math.hypot(x,y),limit=30;joy.x=d>6?x/Math.max(d,limit):0;joy.y=d>6?y/Math.max(d,limit):0;$('#joyKnob').style.transform=`translate(${joy.x*limit}px,${joy.y*limit}px)`;P.path=[];P.target=null;}for(const ev of['pointerup','pointercancel','lostpointercapture'])$('#joystick').addEventListener(ev,()=>{joyPointer=null;joy.x=joy.y=0;$('#joyKnob').style.transform='';});
function screenToWorld(x,y){return{x:(x-W/2)/cam.zoom+cam.x,y:(y-H/2)/cam.zoom+cam.y};}
let pointers=new Map(),down=null,pinch=null;canvas.addEventListener('pointerdown',e=>{if(modal||!$('#welcome').hidden)return;canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});down={x:e.clientX,y:e.clientY,at:performance.now()};if(pointers.size===2){let p=[...pointers.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),z:cam.goalZoom};down=null;}});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)){hover=screenToWorld(e.clientX,e.clientY);return;}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&pointers.size===2){let p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);cam.goalZoom=Math.max(.45,Math.min(1.6,pinch.z*d/pinch.d));}else if(down&&Math.hypot(down.x-e.clientX,down.y-e.clientY)>12){if(W>650){manualCamera={x:cam.x-(e.clientX-down.x)/cam.zoom,y:cam.y-(e.clientY-down.y)/cam.zoom,until:clock+2};down={x:e.clientX,y:e.clientY,at:0};}}});
canvas.addEventListener('pointerup',e=>{const d=down;pointers.delete(e.pointerId);if(pinch){if(pointers.size<2)pinch=null;down=null;return;}down=null;if(!d||performance.now()-d.at>700||Math.hypot(e.clientX-d.x,e.clientY-d.y)>15)return;const p=screenToWorld(e.clientX,e.clientY);if(placing){placing.x=Math.round(p.x/28)*28;placing.y=Math.round(p.y/28)*28;tone(540,.07);return;}const target=objectAt(p.x,p.y);if(target)approach(target);else{P.target=null;if(routeTo(p.x,p.y)){rings.push({x:p.x,y:p.y,t:clock});tone(650,.05,'sine',.015);}else toast('这里暂时走不过去，试试旁边的空地。');}});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);pinch=null;down=null;});canvas.addEventListener('wheel',e=>{e.preventDefault();cam.goalZoom=Math.max(.45,Math.min(1.6,cam.goalZoom-e.deltaY*.001));},{passive:false});
function objectAt(x,y){let list=S.room?[{id:900,kind:'exit',x:1100,y:1120},...S.decor.filter(o=>o.room)]:objects.concat(S.decor.filter(o=>!o.room));list=[...list].sort((a,b)=>b.y-a.y);for(const o of list){if(o.kind==='flower'||['shell','branch','bottle'].includes(o.kind)&&isGathered(o.id))continue;const h=['fruit','tree','pine'].includes(o.kind)?155:['home','shop','neighborhouse'].includes(o.kind)?185:o.kind==='npc'?90:45,w=['home','shop','neighborhouse'].includes(o.kind)?90:['fruit','tree','pine'].includes(o.kind)?50:o.kind==='pond'?60:38;if(x>o.x-w&&x<o.x+w&&y>o.y-h&&y<o.y+22)return o;}if(!S.room&&landCtx.isPointInPath(pond,x,y))return objects.find(o=>o.kind==='pond');return null;}
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';if(!lastFrame){cam.zoom=cam.goalZoom=W<650?.86:1.02;}}
function update(dt){clock+=dt;if(S.started&&$('#welcome').hidden&&!document.hidden){S.time=Math.min(23.9,S.time+dt/125);S.elapsed+=dt;}
let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+joy.x,dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0)+joy.y;P.walking=false;
if(!modal&&!placing&&S.started&&$('#welcome').hidden){if(dx||dy){const d=Math.hypot(dx,dy);dx/=Math.max(1,d);dy/=Math.max(1,d);movePlayer(dx*152*dt,dy*152*dt);}else if(P.path.length){const next=P.path[0],d=Math.hypot(next.x-P.x,next.y-P.y),step=152*dt;if(d<step+1){P.x=next.x;P.y=next.y;P.path.shift();if(!P.path.length&&P.target){const o=P.target;P.target=null;if(Math.hypot(P.x-o.x,P.y-o.y)<145)interactObject(o);else toast('已经走近了，再点一次就能互动。');}}else movePlayer((next.x-P.x)/d*step,(next.y-P.y)/d*step);}}
let cx=P.x,cy=P.y-(W<650?55:65);if(manualCamera&&manualCamera.until>clock&&!P.walking){cx=manualCamera.x;cy=manualCamera.y;}cam.x+=(cx-cam.x)*Math.min(1,dt*5.5);cam.y+=(cy-cam.y)*Math.min(1,dt*5.5);cam.zoom+=(cam.goalZoom-cam.zoom)*Math.min(1,dt*7);
if(!S.room){for(const o of objects.filter(o=>o.kind==='npc')){syncRoutine(o);if(P.target===o||modal==='neighbor'&&Math.hypot(P.x-o.x,P.y-o.y)<160){o.walking=false;continue;}o.wait-=dt;if(o.wait<=0){if(!o.dest){o.dest={x:o.homeX+(Math.random()-.5)*100,y:o.homeY+(Math.random()-.5)*90};if(!walkable(o.dest.x,o.dest.y))o.dest=null;o.wait=2;}else{let d=Math.hypot(o.dest.x-o.x,o.dest.y-o.y);if(d<4){o.dest=null;o.wait=3+Math.random()*4;o.walking=false;}else{o.x+=(o.dest.x-o.x)/d*22*dt;o.y+=(o.dest.y-o.y)/d*22*dt;o.walking=true;}}}}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.text)p.vy+=150*dt;if(p.life<=0)particles.splice(i,1);}rings=rings.filter(r=>clock-r.t<1.2);updateFishing();}
function movePlayer(dx,dy){if(!solidAt(P.x+dx,P.y)){P.x+=dx;if(Math.abs(dx)>.01)P.face=dx>0?1:-1;P.walking=true;}if(!solidAt(P.x,P.y+dy)){P.y+=dy;P.walking=true;}}
function drawWater(g){g.fillStyle='#60b7b7';g.fillRect(0,0,W,H);const zoom=cam.zoom;g.save();g.translate(W/2-cam.x*zoom,H/2-cam.y*zoom);g.scale(zoom,zoom);for(let i=0;i<210;i++){const x=rnd(i+888)*(WORLD_W+200)-100,y=rnd(i+999)*(WORLD_H+200)-100,osc=Math.sin(clock*1.2+i)*7;line(g,[[x+osc,y],[x+20+osc,y]],'#c6e4d24a',2);}g.restore();}
function render(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);drawWater(ctx);ctx.save();ctx.translate(W/2,H/2);ctx.scale(cam.zoom,cam.zoom);ctx.translate(-cam.x,-cam.y);if(S.room)renderInterior(ctx);else ctx.drawImage(groundCache,0,0);
if(!S.room){ctx.save();ctx.globalAlpha=.12;ctx.translate(0,5+Math.sin(clock)*2);ctx.strokeStyle='#fff4cb';ctx.lineWidth=7;ctx.stroke(landPath);ctx.restore();
// Tiny floating lily leaves and fish silhouettes.
for(let i=0;i<4;i++){const x=1410+i*49,y=647+Math.sin(i*3)*51;ellipse(ctx,x,y,10,5,'#9fbe8a');line(ctx,[[x,y],[x+7,y-3]],'#76a078',1);}for(let i=0;i<3;i++){const x=1430+i*70+Math.sin(clock*.4+i)*25,y=700+Math.cos(clock*.5+i)*20;ellipse(ctx,x,y,12,4,'#507f772c');poly(ctx,[[x-12,y],[x-20,y-5],[x-19,y+5]],'#507f772c');}}
if(P.path.length>1){ctx.save();ctx.strokeStyle='#fff6d666';ctx.lineWidth=2;ctx.setLineDash([3,10]);ctx.beginPath();ctx.moveTo(P.x,P.y);for(const p of P.path)ctx.lineTo(p.x,p.y);ctx.stroke();ctx.restore();}
for(const r of rings){const age=clock-r.t;ctx.globalAlpha=(1-age/1.2)*.7;ctx.strokeStyle='#fff6d4';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(r.x,r.y,12+age*18,6+age*8,0,0,6.28);ctx.stroke();ctx.globalAlpha=1;}
let list=(S.room?[]:objects).concat(S.decor.filter(o=>!!o.room===!!S.room));if(S.room)list=list.concat([{kind:'bed',x:855,y:890},{kind:'table',x:1300,y:900},{kind:'planter',x:1390,y:830},{kind:'lamp',x:792,y:815}]);list=list.concat([{kind:'player',x:P.x,y:P.y}]).sort((a,b)=>a.y-b.y);
for(const o of list){if(Math.abs(o.x-cam.x)*cam.zoom>W/2+200||Math.abs(o.y-cam.y)*cam.zoom>H/2+230)continue;if(o.kind==='player')drawHuman(ctx,P.x,P.y,clock,P.walking,P.face);else drawObject(ctx,o,clock);}
if(placing){const valid=placementValid(placing);ellipse(ctx,placing.x,placing.y,50,24,valid?'#e4eedc88':'#d8877277');drawFurniture(ctx,placing,.65);label(ctx,valid?'可以放这里':'换一块空地',placing.x,placing.y-110,valid?'#fff6d9':'#f3c4ab','#6c825a',10);}
for(const p of particles){ctx.save();ctx.globalAlpha=Math.min(1,p.life/.3);if(p.text){ctx.font="600 14px 'Microsoft YaHei',sans-serif";ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#75915b88';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.color;ctx.fillText(p.text,p.x,p.y);}else{ctx.translate(p.x,p.y);ctx.rotate(p.life*5);poly(ctx,[[0,-p.size],[p.size*.35,-p.size*.3],[p.size,0],[p.size*.35,p.size*.3],[0,p.size],[-p.size*.35,p.size*.3],[-p.size,0],[-p.size*.35,-p.size*.3]],p.color);}ctx.restore();}
if(!S.room){for(let i=0;i<9;i++){const x=700+Math.sin(clock*.17+i*7)*450,y=780+Math.cos(clock*.13+i*3)*360;const flap=Math.abs(Math.sin(clock*8+i))*5;ellipse(ctx,x-flap/2,y-30,flap,3,['#fff0c2','#edc5b1','#e4dfbb'][i%3]);ellipse(ctx,x+flap/2,y-30,flap,3,['#fff0c2','#edc5b1','#e4dfbb'][i%3]);}}
ctx.restore();if(S.time>17&&!S.room){ctx.fillStyle=`rgba(74,77,111,${Math.min(.24,(S.time-17)*.035)})`;ctx.fillRect(0,0,W,H);}const vignette=ctx.createRadialGradient(W/2,H*.45,H*.2,W/2,H*.45,Math.max(W,H)*.8);vignette.addColorStop(0,'#e9ecbd00');vignette.addColorStop(1,'#386e641b');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);}
function frame(ts){let dt=lastFrame?Math.min(.05,(ts-lastFrame)/1000):.016;lastFrame=ts;if(!document.hidden){update(dt);render();}requestAnimationFrame(frame);}
createGround();initWorld();fillIcons();resize();window.addEventListener('resize',resize);updateHUD();$('#playerName').value=S.name;$$('#colorPicker button').forEach(x=>x.classList.toggle('selected',x.dataset.color===S.shirt));if(S.started){$('#welcome .start-button').innerHTML='回到我的小岛 <span>→</span>';$('#welcome label').textContent='熟悉的海风，还在等你';}if(loadError)toast('本机存档无法读取，已准备一座新小岛。');
setInterval(()=>{if(!document.hidden){updateInteract();updateHUD();let area=S.room?'我的小屋':P.y>1550?'南岸露营地':P.x>1950?(P.y<720?'北岸果林':'东侧湿地'):P.y>1280?'海风栈桥':P.x>1350&&P.y<900?'月牙池塘':P.x<900&&P.y<950?'小屋与花园':P.x>1100&&P.y<600?'海风杂货铺':'迎风广场';$('#areaLabel').textContent=area;}},400);setInterval(()=>{if(S.started)save();},6000);setInterval(()=>{if(soundOn&&!document.hidden&&!modal){tone(660+Math.random()*120,.13,'sine',.012);setTimeout(()=>tone(880,.12,'sine',.008),160);}},11000);window.addEventListener('pagehide',save);requestAnimationFrame(frame);
</script>
